name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 ships with the Android SDK preinstalled (ANDROID_HOME).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ]; then echo "::error::ANDROID_HOME is not set on this runner"; exit 1; fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Gradle errors are also posted as annotations, so they show on the run page.
      - name: Unit tests and APK
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|FAILED|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $status

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk notif-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: notif-apk-${{ github.run_number }}
          path: notif-${{ github.run_number }}.apk

      # On main, also publish a pre-release so the APK can be downloaded straight from the phone.
      - name: Publish pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Notif build ${{ github.run_number }}
          prerelease: true
          files: notif-${{ github.run_number }}.apk
